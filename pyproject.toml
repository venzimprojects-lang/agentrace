[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentrace"
version = "0.1.0"
description = "Race Claude Code, Codex and Gemini CLI on your own codebase."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "venzimprojects-lang"}]
keywords = ["ai", "agents", "codex", "claude", "gemini", "benchmark", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agentrace = "agentrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
